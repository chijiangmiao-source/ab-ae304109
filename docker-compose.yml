# 控制表达式代数重写复核 —— Docker Compose
#
# 宿主端口可通过环境变量 HOST_PORT 配置（默认 8080）：
#   HOST_PORT=9090 docker compose up --build
#
# 一次性验收（verify 服务执行后退出，以退出码报告结果）：
#   docker compose run --rm verify
# 或在 CI 中：
#   HOST_PORT=8080 docker compose up --build --abort-on-container-exit \
#       --exit-code-from verify

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: rewrite-verifier:latest
    environment:
      HOST_ADDR: "0.0.0.0"
      HOST_PORT: "8080"
    ports:
      # 宿主机可配置端口 -> 容器固定 8080
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  verify:
    image: rewrite-verifier:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      web:
        condition: service_healthy
    environment:
      # 对容器网络中的真实 web 服务做 HTTP/接口冒烟
      BASE_URL: "http://web:8080"
    # 一次性服务：执行构建检查、代码测试与三类场景冒烟后退出
    entrypoint: ["/app/verify/verify"]
    restart: "no"
